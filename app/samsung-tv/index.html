<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="referrer" content="no-referrer">
  <link rel="preconnect" href="https://cinema.panel-pro.ro">
  <link rel="dns-prefetch" href="//cinema.panel-pro.ro">
  <link rel="preconnect" href="https://api.themoviedb.org">
  <link rel="dns-prefetch" href="//api.themoviedb.org">
  <title>Cinema Library</title>
  <style>
    * { box-sizing: border-box; }
    html, body, #app-frame { width: 100%; height: 100%; margin: 0; }
    html, body { overflow: hidden; background: #08080b; }
    #app-frame { display: block; border: 0; background: #08080b; }
    .app-status {
      position: fixed; inset: 0; display: grid; place-items: center;
      background: #08080b; color: #a0a0ad; font: 600 22px system-ui; z-index: 2;
    }
    .app-status[hidden] { display: none; }
    .app-status button {
      margin-top: 18px; padding: 12px 18px; border: 1px solid #e50914;
      border-radius: 8px; background: #e50914; color: #fff; font: inherit;
    }
  </style>
</head>
<body>
  <div class="app-status" id="app-loading" role="status">Se încarcă Cinema Library…</div>
  <div class="app-status" id="app-error" hidden>
    <div>Nu s-a putut încărca Cinema Library.<br><button id="retry" type="button">Reîncearcă</button></div>
  </div>
  <iframe id="app-frame" title="Cinema Library"
    src="https://cinema.panel-pro.ro/?tv=1&tvapp=1.7.6"
    fetchpriority="high" referrerpolicy="origin"
    allow="autoplay *; fullscreen *; encrypted-media *; picture-in-picture *"
    allowfullscreen></iframe>
  <script src="main.js"></script>
</body>
</html>
